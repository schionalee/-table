<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Semaine à table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Mise en page : une colonne étroite, un jour par ligne avec son bloc date à gauche, liste de courses classée par rayon du drive. */
:root {
  --bg: #F1F4EF;
  --surface: #FFFFFF;
  --ink: #1B2A22;
  --muted: #566860;
  --line: #D7DFD8;
  --accent: #1F5F7A;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEBF1;
  --veg: #2C7745;
  --veg-soft: #DCEFE1;
  --fish-ink: #1F5F7A;
  --fish-soft: #DCEBF1;
  --meat-ink: #8A4529;
  --meat-soft: #F4E3DA;
  --tool-soft: #E8ECE7;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111A16;
    --surface: #1A2520;
    --ink: #E5EEE8;
    --muted: #9CB0A5;
    --line: #2D3C35;
    --accent: #6FB8D6;
    --accent-ink: #0D1B22;
    --accent-soft: #1E3641;
    --veg: #7CCB93;
    --veg-soft: #1D3828;
    --fish-ink: #8CC8E0;
    --fish-soft: #1E3641;
    --meat-ink: #E5A98A;
    --meat-soft: #3A2A22;
    --tool-soft: #25332C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111A16;
  --surface: #1A2520;
  --ink: #E5EEE8;
  --muted: #9CB0A5;
  --line: #2D3C35;
  --accent: #6FB8D6;
  --accent-ink: #0D1B22;
  --accent-soft: #1E3641;
  --veg: #7CCB93;
  --veg-soft: #1D3828;
  --fish-ink: #8CC8E0;
  --fish-soft: #1E3641;
  --meat-ink: #E5A98A;
  --meat-soft: #3A2A22;
  --tool-soft: #25332C;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-inline: 16px;
  padding-block: 0 48px;
}
.wrap { max-width: 640px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
button, input { font: inherit; color: inherit; }
#wiz[hidden] { display: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  padding-block: 14px 10px;
  display: grid;
  gap: 10px;
}
.top h1 { font-size: 26px; line-height: 1.1; letter-spacing: -0.01em; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--tool-soft); border-radius: 12px; }
.tab { border: 0; background: transparent; padding: 9px 6px; border-radius: 9px; font-weight: 600; color: var(--muted); cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; min-height: 40px; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.badge { font-size: 12px; font-variant-numeric: tabular-nums; background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 1px 8px; }

.toolbar { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px; margin-block: 8px 12px; }
.field { display: grid; gap: 3px; font-size: 12px; color: var(--muted); font-weight: 500; }
.field select { border: 1px solid var(--line); background: var(--surface); color: inherit; border-radius: 10px; padding: 8px 10px; min-height: 40px; font-size: 15px; }
.field input { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; min-height: 40px; font-size: 15px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; min-height: 40px; font-weight: 600; cursor: pointer; font-size: 14px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { min-height: 34px; padding: 5px 10px; font-size: 13px; font-weight: 500; }
a.btn { text-decoration: none; display: inline-flex; align-items: center; }

details.budget { margin-block: 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px 14px; }
details.budget summary { cursor: pointer; font-weight: 600; min-height: 44px; display: flex; align-items: center; }
.bform { display: flex; flex-wrap: wrap; gap: 10px; margin-block: 4px 10px; }
.bform .field { flex: 1; min-width: 140px; }
.tablewrap { overflow-x: auto; margin-bottom: 8px; }
.btable { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
.btable th, .btable td { padding: 7px 6px; text-align: right; border-bottom: 1px solid var(--line); }
.btable th:first-child, .btable td:first-child { text-align: left; }
.btable th { color: var(--muted); font-weight: 500; font-size: 12px; }
.btable tr.over td { color: var(--meat-ink); font-weight: 600; }

.balance { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; margin-bottom: 14px; }
.balance div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.balance div:last-child { border-bottom: 0; }
.balance dt, .balance dd { margin: 0; }
.balance dt { color: var(--muted); }
.balance dd { font-weight: 600; text-align: right; }
.balance dl { margin: 0; }

.days { display: grid; gap: 10px; }
.day { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.day.off { opacity: .75; }
.who { font-weight: 600; }
.date { border-radius: 10px; background: var(--tool-soft); display: grid; align-content: center; justify-items: center; padding: 6px 0; height: 62px; }
.date.veg { background: var(--veg-soft); color: var(--veg); }
.dow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.dnum { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
.chip { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--tool-soft); color: var(--muted); }
.chip.fish { background: var(--fish-soft); color: var(--fish-ink); }
.chip.meat { background: var(--meat-soft); color: var(--meat-ink); }
.chip.veg { background: var(--veg-soft); color: var(--veg); }
.day h3 { font-size: 18px; line-height: 1.2; }
.hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.hd h3 { flex: 1; min-width: 0; }
.ph { width: 88px; height: 88px; flex: none; border-radius: 12px; object-fit: cover; display: block; }
.phctl { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.phctl label { display: inline-flex; align-items: center; cursor: pointer; }
.with { margin: 5px 0 0; color: var(--ink); }
.kid { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
details.recipe { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
details.recipe summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--accent); min-height: 32px; display: flex; align-items: center; }
.recipe h4 { margin: 12px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.recipe ul, .recipe ol { margin: 0; padding-left: 20px; display: grid; gap: 3px; }
.recipe .ing { list-style: none; padding: 0; }
.recipe .ing li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--line); padding-block: 3px; }
.recipe .ing b { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.recipe p { margin: 6px 0 0; font-size: 14px; }
.foot { color: var(--muted); font-size: 13px; margin-top: 16px; }

.progress { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-block: 8px 12px; display: grid; gap: 8px; }
.progress .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.progress strong { font-family: var(--font-display); font-size: 18px; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--veg); width: 0; transition: width .2s; }
.row-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.addform { display: flex; gap: 6px; margin-block: 12px; }
.addform input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; min-height: 40px; }
.group { margin-top: 16px; }
.group h3 { font-size: 15px; display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 6px; }
.group .cnt { font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.items { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.items li { border-bottom: 1px solid var(--line); }
.items li:last-child { border-bottom: 0; }
.item { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 14px; cursor: pointer; }
.item input { width: 22px; height: 22px; margin: 0; accent-color: var(--veg); }
.item .nm { display: block; }
.item small { display: block; color: var(--muted); font-size: 12px; }
.item .q { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
li.done .nm, li.done .q { text-decoration: line-through; color: var(--muted); }
li.done small { opacity: .6; }
.del { border: 0; background: transparent; color: var(--muted); font-size: 18px; padding: 4px 10px; cursor: pointer; }
.custom-row { display: flex; align-items: center; }
.custom-row .item { flex: 1; min-width: 0; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 6px; }
details.basics { margin-top: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; }
details.basics summary { cursor: pointer; font-weight: 600; min-height: 44px; display: flex; align-items: center; }
details.basics label { display: flex; gap: 10px; align-items: center; padding-block: 8px; border-top: 1px solid var(--line); }
details.basics input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
textarea.copybox { width: 100%; min-height: 150px; margin-top: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px; font: inherit; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
#wiz { position: fixed; inset: 0; z-index: 8; background: var(--bg); overflow-y: auto; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 0; }
.winner { max-width: 520px; margin-inline: auto; min-height: 100%; display: flex; flex-direction: column; }
.whead { display: flex; align-items: center; gap: 12px; min-height: 40px; }
.whead .bar { flex: 1; }
.whead .bar i { background: var(--accent); }
#wiz h2 { font-size: 30px; line-height: 1.1; letter-spacing: -0.01em; margin-top: 22px; }
.wsub { color: var(--muted); margin: 10px 0 20px; font-size: 16px; }
.wgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.wtile { border: 1.5px solid var(--line); background: var(--surface); border-radius: 16px; padding: 16px 10px; min-height: 108px; display: grid; justify-items: center; align-content: center; gap: 6px; cursor: pointer; text-align: center; font-weight: 600; color: var(--muted); }
.wtile span { color: var(--ink); }
.wtile small { font-weight: 400; font-size: 13px; color: var(--muted); }
.wtile[aria-pressed="true"], .wseg button[aria-pressed="true"], .wdays button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.wnote { margin-top: 14px; }
.whouse { display: grid; gap: 8px; }
.wrange { width: 100%; accent-color: var(--accent); height: 32px; }
.wends { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.cost { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-block: 8px 12px; display: grid; gap: 8px; }
.cost .row { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.cost strong { display: block; font-family: var(--font-display); font-size: 26px; font-variant-numeric: tabular-nums; }
.cost .field input { width: 120px; }
.cost .bar i { background: var(--accent); }
.cost.over .bar i { background: var(--meat-ink); }
.cost.over strong { color: var(--meat-ink); }
.wrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 8px 12px; min-height: 56px; font-weight: 600; }
.wrow select { font: inherit; color: inherit; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 6px 10px; min-height: 40px; }
.wstep { display: flex; align-items: center; gap: 4px; }
.wstep b { min-width: 34px; text-align: center; font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.wstep button { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--bg); font-size: 20px; font-weight: 600; cursor: pointer; padding: 0; }
.wh3 { font-size: 18px; margin: 22px 0 4px; }
.wchips { display: flex; flex-wrap: wrap; gap: 6px; }
.wchips button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 13px; min-height: 38px; font-weight: 500; font-size: 14px; cursor: pointer; }
.wchips button[aria-pressed="true"] { border-color: var(--meat-ink); background: var(--meat-soft); color: var(--meat-ink); text-decoration: line-through; }
.wbig { font-family: var(--font-display); font-weight: 700; font-size: 72px; line-height: 1; text-align: center; margin: 18px 0 24px; font-variant-numeric: tabular-nums; }
.wbig small { font-family: var(--font-body); font-size: 16px; font-weight: 500; color: var(--muted); }
.wseg, .wdays { display: grid; gap: 6px; }
.wseg { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.wdays { grid-template-columns: repeat(7, minmax(0, 1fr)); }
.wseg button, .wdays button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; min-height: 56px; font-weight: 600; cursor: pointer; padding: 0; font-size: 14px; font-variant-numeric: tabular-nums; }
.wmsg { margin: 16px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--meat-soft); color: var(--meat-ink); font-size: 14px; }
.wfoot { position: sticky; bottom: 0; margin-top: auto; padding-block: 20px calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--bg); }
.wgo { width: 100%; min-height: 52px; border-radius: 99px; font-size: 16px; }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100% - 32px); text-align: center; z-index: 10; }
#toast.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .bar i, #toast { transition: none; } }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Semaine à table</h1>
      <p class="sub" id="sub">Drive Intermarché de Clermont-l’Hérault</p>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-act="tab" data-tab="menu" id="tab-menu">Dîners</button>
      <button class="tab" role="tab" data-act="tab" data-tab="lunch" id="tab-lunch">Midis</button>
      <button class="tab" role="tab" data-act="tab" data-tab="list" id="tab-list">Courses <span class="badge" id="badge">0</span></button>
    </div>
  </header>
  <main id="app"></main>
</div>
<div id="wiz" hidden></div>
<div id="toast" role="status"></div>

<script>
(function () {
'use strict';
var KEY = 'semaine-a-table-v3';
function I(n, q, u, r) { return { n: n, q: q, u: u, r: r }; }

/* ---------- Données ---------- */
var RAYONS = [['fl','Fruits et légumes'],['bo','Boucherie, volaille'],['po','Poissonnerie'],['fr','Crèmerie, frais'],['su','Surgelés'],['ep','Épicerie'],['bk','Boulangerie'],['di','Ajouts']];
var DOW = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
var MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

/* Dîners : un seul repas pour tout le monde, sans féculent. "inclus" = le plat est servi sur sa propre purée de légumes. */
var MAINS = [
  { id:'saumon-four', nom:'Pavé de saumon au four, citron', t:'poisson', gras:true, ap:['four'], min:25,
    ing:[I('Pavé de saumon',4,'pce','po'),I('Citron',1,'pce','fl'),I('Huile d’olive',0,'','pl'),I('Sel, poivre',0,'','pl')],
    steps:['Préchauffez le four à 200 °C.','Posez les pavés sur une plaque garnie de papier cuisson, arrosez d’huile d’olive et de jus de citron, salez.','Enfournez 12 à 15 minutes selon l’épaisseur.'] },
  { id:'cabillaud-papillote', nom:'Cabillaud en papillote, beurre citronné', t:'poisson', ap:['four'], min:30,
    ing:[I('Dos de cabillaud',4,'pce','po'),I('Citron',1,'pce','fl'),I('Beurre',30,'g','fr'),I('Herbes de Provence',0,'','pl'),I('Sel, poivre',0,'','pl')],
    steps:['Préchauffez le four à 200 °C.','Découpez 4 carrés de papier cuisson. Déposez un dos de cabillaud sur chacun, une noisette de beurre, 2 rondelles de citron, sel, poivre, herbes.','Fermez bien les papillotes et enfournez 18 minutes.'] },
  { id:'colin-creme', nom:'Colin crème-moutarde (Cookeo)', t:'poisson', ap:['cookeo'], min:20,
    ing:[I('Filets de colin',600,'g','po'),I('Crème légère',15,'cl','fr'),I('Citron',1,'pce','fl'),I('Moutarde',0,'','pl'),I('Sel, poivre',0,'','pl')],
    steps:['Mode Dorer : saisissez les filets avec une cuillère à café d’huile, 2 minutes de chaque côté, puis réservez.','Versez la crème, 1 cuillère de moutarde, un peu de jus de citron et 5 cl d’eau. Remettez le poisson.','Cuisson sous pression 4 minutes (ajustez selon votre modèle et l’épaisseur).'] },
  { id:'gratin-poisson', nom:'Gratin de poisson, béchamel au fromage', t:'poisson', ap:['four'], min:40,
    ing:[I('Filets de colin',600,'g','po'),I('Lait demi-écrémé',50,'cl','fr'),I('Beurre',20,'g','fr'),I('Farine',30,'g','ep'),I('Emmental râpé',50,'g','fr'),I('Muscade',0,'','pl'),I('Sel, poivre',0,'','pl')],
    steps:['Préchauffez le four à 200 °C. Béchamel : faites fondre le beurre, ajoutez la farine, puis le lait peu à peu en fouettant. Salez, muscade.','Disposez le poisson en morceaux dans un plat beurré, nappez de béchamel, parsemez d’emmental.','Enfournez 25 minutes, jusqu’à ce que le dessus soit doré.'] },
  { id:'colin-parmesan', nom:'Colin en croûte de parmesan et d’amandes', t:'poisson', ap:['four'], min:30,
    ing:[I('Filets de colin',600,'g','po'),I('Parmesan râpé',40,'g','fr'),I('Amandes en poudre',40,'g','ep'),I('Citron',1,'pce','fl'),I('Huile d’olive',0,'','pl'),I('Sel, poivre',0,'','pl')],
    steps:['Préchauffez le four à 200 °C. Mélangez le parmesan, la poudre d’amandes, sel et poivre.','Posez les filets sur une plaque garnie de papier cuisson, un filet d’huile, recouvrez du mélange.','Enfournez 15 minutes. Servez avec du citron.'] },

function thumb(id, m) {
  if (PHOTOS[id]) return '<img class="ph" src="' + PHOTOS[id] + '" alt="Votre photo : ' + esc(m.nom) + '">';
  var k = DISHPHOTO[id];
  return k ? '<img class="ph" src="' + STOCK[k] + '" alt="Photo d’illustration : ' + esc(m.nom) + '">' : '';
}
function photoCtl(id) {
  return '<div class="phctl"><label class="btn small">' + (PHOTOS[id] ? 'Changer la photo' : 'Ajouter ma photo du plat') + '<input type="file" accept="image/*" data-ph="' + esc(id) + '" id="ph-' + esc(id) + '" hidden></label>' +
    (PHOTOS[id] ? '<button class="btn small" data-act="delphoto" data-id="' + esc(id) + '">Retirer la photo</button>' : '') + '</div>';
}
function addPhoto(id, file) {
  var fr = new FileReader();
  fr.onerror = function () { toast('Photo illisible'); };
  fr.onload = function () {
    var img = new Image();
    img.onerror = function () { toast('Photo illisible'); };
    img.onload = function () {
      var side = Math.min(img.width, img.height), out = Math.min(360, side), c = document.createElement('canvas');
      c.width = out; c.height = out;
      c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, out, out);
      PHOTOS[id] = c.toDataURL('image/jpeg', 0.72);
      if (!savePhotos()) { delete PHOTOS[id]; toast('Plus de place pour les photos : retirez-en une'); }
      else toast('Photo enregistrée sur cet appareil');
      render();
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function vegSteps(v) {

/* ---------- Actions ---------- */
function swapMain(i) {
  var d = S.plan[i], cur = MAIN[d.m];
  var used = {}, rouges = 0, grasOther = false;
  S.plan.forEach(function (x, j) {
    if (j === i) return;
    used[x.m] = 1;
    var m = MAIN[x.m];
    if (m.rouge) rouges++;
    if (m.t === 'poisson' && m.gras) grasOther = true;
  });
  var cands = DINNER.filter(function (m) {
    if (m.id === cur.id || used[m.id] || m.min > MAXMIN || !mainOk(m) || isSpecial(m) !== isSpecial(cur)) return false;
    return isSpecial(cur) || m.t === cur.t;
  });
  if (!cands.length) { toast('Pas d’autre plat compatible cette semaine'); return; }
  d.m = pick(cands, Math.random).id;
  d.v = MAIN[d.m].inclus ? null : d.v;
  ensureVeg(S.plan, i, Math.random);
}
function swapVeg(i) {
  var d = S.plan[i], used = {};
  if (!d.v) return;
  S.plan.forEach(function (x, j) { if (j !== i && x.v) used[x.v] = 1; });
  var cands = dvegs().filter(function (v) { return v.id !== d.v && !used[v.id]; });
  var same = cands.filter(function (v) { return v.k === VEG[d.v].k; });
  if (same.length) cands = same;
  if (!cands.length) { toast('Pas d’autre légume disponible'); return; }
  d.v = pick(cands, Math.random).id;
}
function swapLunch(i) {
  var used = {}, rouges = 0, fishOther = false;
  S.lunch.forEach(function (x, j) {
    if (j === i) return;
    used[x.l] = 1;
    if (LUNCH[x.l].rouge) rouges++;
    if (LUNCH[x.l].t === 'poisson') fishOther = true;
  });
  var cur = LUNCH[S.lunch[i].l];
  var cands = LUNCHES.filter(function (l) {
    if (l.id === cur.id || used[l.id] || !softOk(l)) return false;
    if (l.rouge && rouges >= 1) return false;
    if (cur.t === 'poisson' && !fishOther && l.t !== 'poisson') return false;
    return true;
  });
  if (!cands.length) { toast('Pas d’autre plat compatible'); return; }
  S.lunch[i].l = pick(cands, Math.random).id;
}
function buildCopy() {
  var data = allEntries(), lines = ['Courses de la semaine du ' + dayDate(0).getDate() + ' ' + MOIS[dayDate(0).getMonth()]];
  RAYONS.forEach(function (r) {
    var rows = data.entries.filter(function (x) { return x.r === r[0] && !S.checked[x.key]; }).sort(function (a, b) { return a.n.localeCompare(b.n, 'fr'); });
    if (!rows.length) return;
    lines.push('', r[1].toUpperCase());
    rows.forEach(function (x) { lines.push('- ' + x.n + (x.qty ? ' (' + x.qty + ')' : '')); });
  });
  return lines.join('\n');
}

/* ---------- Réglages pas à pas ---------- */
var W = null;
var ICON = {
  four: '<rect x="4" y="3" width="24" height="26" rx="3"/><rect x="8" y="12" width="16" height="12" rx="1.5"/><circle cx="10" cy="7.5" r="1"/><circle cx="16" cy="7.5" r="1"/><circle cx="22" cy="7.5" r="1"/>',
  cookeo: '<path d="M6 13h20v10a5 5 0 0 1-5 5H11a5 5 0 0 1-5-5z"/><path d="M4 13h24M12 9h8M16 6v3M3 17h3M26 17h3"/>',
  plaques: '<rect x="3" y="8" width="26" height="16" rx="3"/><circle cx="11" cy="16" r="4"/><circle cx="22" cy="16" r="3"/>',
  airfryer: '<path d="M8 12a8 8 0 0 1 16 0v12a4 4 0 0 1-4 4h-8a4 4 0 0 1-4-4z"/><path d="M8 17h16M13 22h6"/><circle cx="16" cy="10.5" r="1.5"/>',
  micro: '<rect x="3" y="7" width="26" height="18" rx="3"/><rect x="6.5" y="10.5" width="14" height="11" rx="1.5"/><circle cx="24.5" cy="12.5" r="1"/><circle cx="24.5" cy="17" r="1"/>',
  blender: '<path d="M10 4h12l-2 15h-8z"/><path d="M9 19h14l1 9H8zM22 8h3v5h-3.5"/><circle cx="16" cy="24" r="1.2"/>'
};
var TIMES = [15, 20, 30, 45, 60, 90];
var LMODES = [['rest', 'Les restes de la veille', 'On cuisine un peu plus au dîner'], ['quick', 'Quelque chose de rapide', 'Un petit plat de moins de 25 minutes'], ['mix', 'Un peu des deux', 'Un jour des restes, le lendemain un petit plat'], ['none', 'Seulement les dîners', 'Pas de midi à prévoir']];
var WDAYS = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
function openWiz() {
  var h = {}; APPS.forEach(function (a) { h[a[0]] = !!HAVE[a[0]]; });
  W = { step: 0, have: h, max: TIMES.indexOf(S.maxMin) >= 0 ? S.maxMin : (S.maxMin > 90 ? 90 : 30), cook: COOK.slice(), lmode: LMODE, budget: BUDGET, adults: ADULTS, kids: KIDS.slice(), dis: JSON.parse(JSON.stringify(DIS)), msg: '' };
  renderWiz();
}
function budgetStep() {
  var on = !!W.budget;
  return '<p class="wbig">' + (on ? W.budget + '<small> €</small>' : '<small>Pas de budget</small>') + '</p>' +
    (on ? '<input type="range" class="wrange" id="wbudget" min="40" max="400" step="5" value="' + W.budget + '" aria-label="Budget par semaine en euros"><div class="wends"><span>40 €</span><span>400 €</span></div>' : '') +
    '<div class="wchips" style="justify-content:center;margin-top:18px"><button data-act="wiznob" aria-pressed="' + (on ? 'false' : 'true') + '">' + (on ? 'Sans budget' : 'Fixer un budget') + '</button></div>' +
    '<p class="hint wnote">Prix moyens de supermarché, estimés. Vous pourrez changer le montant dans l’onglet Courses.</p>';
}
function houseHtml() {
  var stepper = function (label, n, minus, plus) {
    return '<div class="wrow"><span>' + label + '</span><div class="wstep"><button data-act="' + minus + '" aria-label="Retirer">−</button><b>' + n + '</b><button data-act="' + plus + '" aria-label="Ajouter">+</button></div></div>';
  };
  var ages = W.kids.map(function (a, i) {
    var opts = ''; for (var y = 1; y <= 17; y++) opts += '<option value="' + y + '"' + (y === a ? ' selected' : '') + '>' + y + (y > 1 ? ' ans' : ' an') + '</option>';
    return '<label class="wrow">Âge de l’enfant ' + (i + 1) + '<select id="wk-' + i + '" data-wk="' + i + '">' + opts + '</select></label>';
  }).join('');
  return '<div class="whouse">' + stepper('Adultes', W.adults, 'wizadm', 'wizadp') + stepper('Enfants', W.kids.length, 'wizkm', 'wizkp') + ages + '</div>' +
    '<h3 class="wh3">Ce que la famille n’aime pas</h3><p class="hint">Les plats, légumes et accompagnements qui en contiennent ne seront plus proposés.</p><div class="wchips">' +
    DISL.map(function (d) { return '<button data-act="wizdis" data-id="' + d[0] + '" aria-pressed="' + (W.dis[d[0]] ? 'true' : 'false') + '">' + d[1] + '</button>'; }).join('') + '</div>' +
    (W.kids.length > 1 ? '<p class="hint wnote">Le midi à emporter est compté pour 1 adulte et le premier enfant de la liste.</p>' : '');
}
function wizCanNext() {
  if (W.step === 1) return W.have.four || W.have.cookeo || W.have.plaques || W.have.airfryer;
  if (W.step === 3) return W.cook.some(Boolean);
  return true;
}
function renderWiz() {
  var el = document.getElementById('wiz');
  if (!W) { el.hidden = true; el.innerHTML = ''; document.body.style.overflow = ''; return; }
  var titles = ['Qui est à table ?', 'Qu’avez-vous dans votre cuisine ?', 'Combien de temps pour cuisiner ?', 'Quels soirs cuisinez-vous ?', 'Et le midi ?', 'Votre budget courses par semaine ?'];
  var subs = ['Les quantités des recettes et de la liste de courses suivent le nombre de personnes et l’âge des enfants.', 'Touchez vos appareils. Les recettes proposées n’utiliseront que ceux-là.', 'Un soir normal, cuisson comprise. Les plats plus longs sont écartés.', 'Les autres soirs, rien n’est prévu ni acheté : restes, repas libre ou à l’extérieur.', 'Pour ' + (W.kids.length ? '1 adulte et 1 enfant' : '1 adulte') + ', à emporter.', 'Pour ' + plur(W.adults, 'adulte') + (W.kids.length ? ' et ' + plur(W.kids.length, 'enfant') : '') + ', petit-déjeuner et goûters compris. Les menus seront choisis pour tenir dans ce montant.'];
  var body = '';
  if (W.step === 0) {
    body = houseHtml();
  } else if (W.step === 1) {
    body = '<div class="wgrid">' + APPS.map(function (a) {
      return '<button class="wtile" data-act="wizap" data-id="' + a[0] + '" aria-pressed="' + (W.have[a[0]] ? 'true' : 'false') + '"><svg viewBox="0 0 32 32" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[a[0]] + '</svg><span>' + a[1] + '</span></button>';
    }).join('') + '</div><p class="hint wnote">Il faut au moins un appareil de cuisson. Le micro-ondes sert à réchauffer les midis, le blender à lisser les purées.</p>';
  } else if (W.step === 2) {
    body = '<p class="wbig">' + W.max + '<small> minutes</small></p><div class="wseg">' + TIMES.map(function (t) {
      return '<button data-act="wiztime" data-v="' + t + '" aria-pressed="' + (t === W.max ? 'true' : 'false') + '">' + t + '</button>';
    }).join('') + '</div>';
  } else if (W.step === 3) {
    body = '<div class="wdays">' + WDAYS.map(function (d, i) {
      return '<button data-act="wizday" data-i="' + i + '" aria-pressed="' + (W.cook[i] ? 'true' : 'false') + '">' + d + '</button>';
    }).join('') + '</div>';
  } else if (W.step === 5) {
    body = budgetStep();
  } else {
    body = '<div class="wgrid">' + LMODES.map(function (m) {
      return '<button class="wtile" data-act="wizlm" data-id="' + m[0] + '" aria-pressed="' + (W.lmode === m[0] ? 'true' : 'false') + '"><span>' + m[1] + '</span><small>' + m[2] + '</small></button>';
    }).join('') + '</div>';
  }
  el.hidden = false;
  document.body.style.overflow = 'hidden';
  el.innerHTML = '<div class="winner"><div class="whead">' +
    (W.step > 0 ? '<button class="btn" data-act="wizback" aria-label="Étape précédente">←</button>' : (S.setup ? '<button class="btn" data-act="wizclose" aria-label="Fermer">✕</button>' : '')) +
    '<div class="bar"><i style="width:' + ((W.step + 1) * 100 / 6) + '%"></i></div></div>' +
    '<h2>' + titles[W.step] + '</h2><p class="wsub">' + subs[W.step] + '</p>' + body +
    (W.msg ? '<p class="wmsg" role="alert">' + esc(W.msg) + '</p>' : '') +
    '<div class="wfoot"><button class="btn primary wgo" data-act="wiznext"' + (wizCanNext() ? '' : ' disabled') + '>' + (W.step === 5 ? 'Construire ma semaine' : 'Continuer') + '</button></div></div>';
}
function finishWiz() {
  var old = { h: HAVE, m: MAXMIN, c: COOK, l: LMODE, a: ADULTS, k: KIDS, d: DIS, b: BUDGET };
  BUDGET = W.budget || 0;
  ADULTS = W.adults; KIDS = W.kids; DIS = W.dis;
  HAVE = W.have; COOK = W.cook; LMODE = W.lmode; MAXMIN = W.max;
  var tries = [W.max].concat([20, 30, 45, 60, 90, 999].filter(function (t) { return t > W.max; })), okT = 0;
  for (var k = 0; k < tries.length && !okT; k++) { MAXMIN = tries[k]; if (genPlan(newSeed()) || genPlan(newSeed())) okT = tries[k]; }
  if (!okT) {
    HAVE = old.h; MAXMIN = old.m; COOK = old.c; LMODE = old.l; ADULTS = old.a; KIDS = old.k; DIS = old.d; BUDGET = old.b;
    W.step = 0; W.msg = 'Pas assez de recettes avec ces choix pour remplir une semaine. Retirez un aliment de la liste « n’aime pas » ou ajoutez un appareil (les plaques de cuisson ou le Cookeo, par exemple).';
    renderWiz(); return;
  }
  S.adults = ADULTS; S.kids = KIDS; S.dis = DIS; S.budget = BUDGET;
  S.have = HAVE; S.cook = COOK; S.lmode = LMODE; S.maxMin = MAXMIN; S.setup = true;
  S.lunch = genLunch(newSeed()) || S.lunch;
  fitBudget();
  W = null; save(); renderWiz(); render(); window.scrollTo(0, 0);
  if (okT !== tries[0]) toast('Avec ces appareils, il faut ' + (okT >= 999 ? 'plus de 90' : okT) + ' minutes : limite élargie');
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]');
  if (!b) return;
  var a = b.dataset.act;
  if (a === 'setup') { openWiz(); return; }
  if (a.indexOf('wiz') === 0) {
    if (!W) return;
    W.msg = '';
    if (a === 'wizap') W.have[b.dataset.id] = !W.have[b.dataset.id];
    else if (a === 'wizadm') W.adults = Math.max(1, W.adults - 1);
    else if (a === 'wizadp') W.adults = Math.min(8, W.adults + 1);
    else if (a === 'wizkm') W.kids.pop();
    else if (a === 'wizkp') { if (W.kids.length < 8) W.kids.push(8); }
    else if (a === 'wizdis') W.dis[b.dataset.id] = !W.dis[b.dataset.id];
    else if (a === 'wiznob') { if (W.budget) { W.budget = 0; W.noBudget = true; } else { var oa = ADULTS, ok2 = KIDS; ADULTS = W.adults; KIDS = W.kids; W.budget = suggestBudget(); ADULTS = oa; KIDS = ok2; W.noBudget = false; } }
    else if (a === 'wiztime') W.max = +b.dataset.v;
    else if (a === 'wizday') W.cook[+b.dataset.i] = !W.cook[+b.dataset.i];
    else if (a === 'wizlm') W.lmode = b.dataset.id;
    else if (a === 'wizback') W.step = Math.max(0, W.step - 1);
    else if (a === 'wizclose') W = null;
    else if (a === 'wiznext') { if (!wizCanNext()) return; if (W.step === 5) { finishWiz(); return; }
      if (W.step === 4 && !W.budget && !W.noBudget) { var oa = ADULTS, ok2 = KIDS; ADULTS = W.adults; KIDS = W.kids; W.budget = suggestBudget(); ADULTS = oa; KIDS = ok2; } W.step++; }
    renderWiz();
    return;
  }
  if (a === 'tab') { S.tab = b.dataset.tab; copyText = ''; save(); render(); window.scrollTo(0, 0); }
  else if (a === 'regen') {
    S.seed = newSeed(); S.plan = adjustOff(genPlan(S.seed) || S.plan); S.checked = {}; openRecipes = {};
    save(); render(); toast('Nouvelle semaine prête');
  }
  else if (a === 'delphoto') { delete PHOTOS[b.dataset.id]; savePhotos(); render(); }
  else if (a === 'fit') { fitBudget(); save(); render(); }
  else if (a === 'reset') {
    clearTimeout(resetTimer);
    if (!resetArmed) {
      resetArmed = true; render();
      resetTimer = setTimeout(function () { resetArmed = false; render(); }, 5000);
    } else {
      resetArmed = false;
      S.start = tomorrow(); S.custom = []; S.basicsOff = {}; copyText = '';
      S.lunch = genLunch(newSeed()) || S.lunch;
      fitBudget(); S.checked = {};
      save(); render(); window.scrollTo(0, 0); toast('Semaine réinitialisée');
    }
  }
  else if (a === 'swapmain') { swapMain(+b.dataset.i); save(); render(); }
  else if (a === 'swapveg') { swapVeg(+b.dataset.i); save(); render(); }
  else if (a === 'regenlunch') { S.lunch = genLunch(newSeed()) || S.lunch; openLunch = {}; save(); render(); toast('Nouveaux midis prêts'); }
  else if (a === 'lunchswap') { swapLunch(+b.dataset.i); save(); render(); }
  else if (a === 'lunchveg') { pickLV(S.lunch, +b.dataset.i, Math.random, true); save(); render(); }
  else if (a === 'lunchks') { pickKS(S.lunch, +b.dataset.i, Math.random, true); save(); render(); }
  else if (a === 'lunchst') { pickST(S.lunch, +b.dataset.i, Math.random, true); save(); render(); }
  else if (a === 'lunchrest') {
    var ri = +b.dataset.i, rd = S.lunch[ri];
    if (rd.rest && restOn(S.lunch, S.plan, ri)) { rd.rest = false; } else { rd.rest = true; if (!restOn(S.lunch, S.plan, ri)) { rd.rest = false; toast('Ces restes ne se réchauffent pas bien'); } }
    save(); render();
  }
  else if (a === 'lunchoff') { var ld = S.lunch[+b.dataset.i]; ld.off = !ld.off; save(); render(); }
  else if (a === 'uncheck') { S.checked = {}; copyText = ''; save(); render(); }
  else if (a === 'delcustom') { S.custom = S.custom.filter(function (c) { return c.id !== b.dataset.id; }); delete S.checked['c|' + b.dataset.id]; save(); render(); }
  else if (a === 'copy') {
    var text = buildCopy();
    var done = function () { copyText = ''; toast('Liste copiée'); };
    var fail = function () { copyText = text; render(); toast('Copiez le texte sélectionné'); };
    try { navigator.clipboard.writeText(text).then(done, fail); } catch (err) { fail(); }
  }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'start' && /^\d{4}-\d{2}-\d{2}$/.test(t.value)) { S.start = t.value; save(); render(); return; }
  if (t.id === 'maxmin') {
    S.maxMin = parseInt(t.value, 10) || 30; MAXMIN = S.maxMin;
    fitBudget(); save(); render(); return;
  }
  if (t.dataset && t.dataset.wk !== undefined) { if (W) W.kids[+t.dataset.wk] = parseInt(t.value, 10) || 8; return; }
  if (t.dataset && t.dataset.ph) { if (t.files && t.files[0]) addPhoto(t.dataset.ph, t.files[0]); return; }
  if (t.id === 'budget') {
    var bv = parseInt(t.value, 10);
    BUDGET = S.budget = isNaN(bv) || bv <= 0 ? 0 : Math.min(2000, bv);
    save(); render(); return;
  }
  if (t.id === 'target' || t.id === 'reserve') {
    var num = parseInt(t.value, 10);
    if (!isNaN(num)) { S[t.id] = Math.max(0, Math.min(4000, num)); save(); render(); }
    return;
  }
  var a = t.dataset && t.dataset.act;
  if (a === 'check') {
    if (t.checked) S.checked[t.dataset.key] = 1; else delete S.checked[t.dataset.key];
    var li = t.closest('li'); if (li) li.classList.toggle('done', t.checked);
    save(); if (!t.dataset.pl) updateProgress();
  } else if (a === 'basic') {
    if (t.checked) delete S.basicsOff[t.dataset.id]; else S.basicsOff[t.dataset.id] = 1;
    save(); var det = document.querySelector('details.basics'); var wasOpen = det && det.open; render();
    if (wasOpen) { var d2 = document.querySelector('details.basics'); if (d2) d2.open = true; }
  }
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'wbudget' && W) {
    W.budget = parseInt(t.value, 10) || 40;
    var big = document.querySelector('#wiz .wbig'); if (big) big.innerHTML = W.budget + '<small> €</small>';
  }
});
document.addEventListener('submit', function (e) {
  var f = e.target;
  if (f.dataset && f.dataset.act === 'add') {
    e.preventDefault();
    var inp = document.getElementById('newItem'), name = inp.value.trim();
    if (!name) return;
    S.custom.push({ id: String(Date.now()), name: name.slice(0, 60) });
    save(); render();
    var n = document.getElementById('newItem'); if (n) n.focus();
  }
});
document.addEventListener('toggle', function (e) {
  var t = e.target;
  if (t.id === 'budget') { budgetOpen = t.open; return; }
  if (t.classList && t.classList.contains('recipe')) {
    if (t.dataset.l !== undefined) openLunch[t.dataset.l] = t.open; else openRecipes[t.dataset.i] = t.open;
  }
}, true);

render();
if (!S.setup) openWiz();
})();
